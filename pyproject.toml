[project]
name = "hebrewenglish"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Asher Frost", email = "76231370+wizard7377@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "model2vec>=0.10.0",
    "nicegui>=3.18.0",
    "requests>=2.34.2",
    "ruff>=0.17.4",
    "tensorflow>=2.21.0",
    "ty>=0.0.98",
]

[project.scripts]
hebrewenglish = "hebrewenglish.main:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["src/test"]
markers = ["model: uses the real embedding model, which is downloaded on first use"]
